name: Lint and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: ruff (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check bugbounty_toolkit tests
      - run: python -m ruff format --check bugbounty_toolkit tests

  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . coverage
      - name: Core unit tests
        shell: bash
        run: |
          python -m coverage run -m unittest -v \
            tests.test_scope \
            tests.test_recon_pipeline \
            tests.test_recon_campaign \
            tests.test_submission_report \
            tests.test_destination_guard \
            tests.test_requests \
            tests.test_maintenance
      - name: Report recon coverage
        shell: bash
        run: python -m coverage report --include="bugbounty_toolkit/recon/*" --fail-under=85

  image:
    name: docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bbtk:ci .
      - run: docker run --rm bbtk:ci --help
      - run: docker run --rm bbtk:ci run --help
      - run: docker run --rm bbtk:ci doctor
