name: Python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dashboard,xss,sqli,jwt,http,dev]"
      - run: python -m playwright install --with-deps chromium
      - run: python -m pip check
      - run: bbtk --help
      - run: bbtk object-discover ci-object-discovery --input examples/object-discovery/captures.har --attest-authorized-captures --dry-run
      - run: bbtk fuzz-plan ci-context-fuzz --har examples/context-fuzz/capture.har --dry-run
      - run: bbtk fuzz-plan ci-context-fuzz --capture labs/context_fuzz_lab/fixtures/capture.burp.xml --dry-run
      - run: python labs/context_fuzz_lab/multi_capture_benchmark.py
      - run: python -m labs.dashboard_triage_lab.run_lab > /dev/null
      - run: bbtk lab object-discover --dry-run --split eval
      - run: bash -n labs/idor_lab/run.sh
      - run: python scripts/ai_provider_benchmark.py > /dev/null
      - run: python labs/unified_ai_eval/run.py > /dev/null
      - run: python -m labs.investigation_workflow_eval.run_lab > /dev/null
      - run: ruff check bugbounty_toolkit tests scripts skills labs
      - run: ruff format --check bugbounty_toolkit tests scripts skills labs
      - run: mypy --strict
      - run: coverage run -m unittest discover -s tests -v
      - run: coverage report --include="bugbounty_toolkit/access_control/comparison.py,bugbounty_toolkit/access_control/write_lab.py" --fail-under=90
      - run: coverage report --include="bugbounty_toolkit/hunt.py,bugbounty_toolkit/ssrf_check.py,bugbounty_toolkit/csrf_audit.py,bugbounty_toolkit/jwt_forge.py" --fail-under=80
      - run: coverage report --include="bugbounty_toolkit/analysis/evidence_engine.py" --fail-under=85
      - run: coverage report --include="bugbounty_toolkit/analysis/api_workflow.py" --fail-under=80
      - run: coverage report --include="bugbounty_toolkit/analysis/object_relationships.py,bugbounty_toolkit/analysis/object_handoff.py,bugbounty_toolkit/core/private_files.py,bugbounty_toolkit/core/redaction.py" --fail-under=90
      - run: coverage report --include="bugbounty_toolkit/analysis/evidence_graph.py" --fail-under=80
      - run: coverage report --include="bugbounty_toolkit/web_vuln_lab_server.py" --fail-under=80
      - run: coverage report --include="bugbounty_toolkit/access_control/function_matrix.py" --fail-under=80
      - run: coverage report --include="bugbounty_toolkit/analysis/benchmark.py" --fail-under=85
      - run: coverage report --include="bugbounty_toolkit/analysis/prioritization.py,bugbounty_toolkit/analysis/evidence_gap_planner.py" --fail-under=85
      - run: coverage report --include="bugbounty_toolkit/analysis/investigation.py" --fail-under=85
      - run: coverage report --include="bugbounty_toolkit/reporting/finding_report.py" --fail-under=85
      - run: coverage report --include="bugbounty_toolkit/dashboard.py" --fail-under=80
      - run: coverage report --include="bugbounty_toolkit/dashboard_triage.py" --fail-under=85
      - run: coverage report --include="bugbounty_toolkit/analysis/ai_providers.py,bugbounty_toolkit/analysis/multi_review.py,bugbounty_toolkit/analysis/ai_review_eval.py" --fail-under=90
      - run: coverage report --include="bugbounty_toolkit/analysis/ai_backend.py,bugbounty_toolkit/analysis/dual_review.py" --fail-under=85
      - run: coverage report --include="bugbounty_toolkit/fuzzing/wordlist_manager.py" --fail-under=80
      - run: coverage report --include="bugbounty_toolkit/fuzzing/context_planner.py,bugbounty_toolkit/fuzzing/capture_adapter.py,bugbounty_toolkit/context_fuzz_lab_server.py" --fail-under=80
      - run: coverage report

  offline-lab:
    # Optional reproducible offline lab: build (networked) then verify with --network none.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/offline_lab/common.sh scripts/offline_lab/build.sh scripts/offline_lab/run.sh scripts/offline_lab/verify.sh
      - run: scripts/offline_lab/build.sh --playwright
      - run: scripts/offline_lab/verify.sh --playwright
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-lab-results
          path: offline-lab-results/
          if-no-files-found: ignore
