name: Python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[xss,sqli,jwt,http,dev]"
      - run: python -m pip check
      - run: bbtk --help
      - run: ruff check bugbounty_toolkit/apk_scan.py bugbounty_toolkit/csrf_audit.py bugbounty_toolkit/jwt_forge.py bugbounty_toolkit/takeover_check.py bugbounty_toolkit/analysis/html_context.py tests/test_apk_scan.py tests/test_csrf_audit.py tests/test_jwt_forge.py tests/test_takeover_check.py tests/test_evidence_review.py tests/test_skill_plan.py
      - run: ruff format --check bugbounty_toolkit/apk_scan.py bugbounty_toolkit/csrf_audit.py bugbounty_toolkit/jwt_forge.py bugbounty_toolkit/takeover_check.py bugbounty_toolkit/analysis/html_context.py bugbounty_toolkit/analysis/evidence_review.py skills/bugbounty-executor/scripts/run_plan.py scripts/install_skills.py tests/test_apk_scan.py tests/test_csrf_audit.py tests/test_jwt_forge.py tests/test_takeover_check.py tests/test_skill_plan.py
      - run: ruff check bugbounty_toolkit/access_control/comparison.py bugbounty_toolkit/access_control/range_checker.py bugbounty_toolkit/access_control/write_lab.py bugbounty_toolkit/core/execution_budget.py bugbounty_toolkit/core/http_client.py bugbounty_toolkit/core/rate_limiter.py bugbounty_toolkit/core/reporting.py bugbounty_toolkit/core/settings.py bugbounty_toolkit/diagnostics.py bugbounty_toolkit/reporting/review_markdown.py bugbounty_toolkit/cli.py bugbounty_toolkit/xss/parameter_tester.py bugbounty_toolkit/xss/playwright_confirm.py bugbounty_toolkit/analysis/live_review.py bugbounty_toolkit/analysis/evidence_review.py bugbounty_toolkit/ssrf_check.py skills/bugbounty-executor/scripts/run_plan.py scripts/install_skills.py tests/test_access_control.py tests/test_access_write_lab.py tests/test_access_cli.py tests/test_access_properties.py tests/test_execution_budget.py tests/test_maintenance.py tests/test_core_utilities.py tests/test_skill_plan.py tests/test_workflow.py tests/test_xss.py tests/test_live_ai_review.py tests/test_ssrf_check.py tests/test_evidence_review.py tests/test_apk_scan.py
      - run: ruff format --check bugbounty_toolkit/access_control/comparison.py bugbounty_toolkit/access_control/range_checker.py bugbounty_toolkit/access_control/write_lab.py bugbounty_toolkit/core/execution_budget.py bugbounty_toolkit/core/http_client.py bugbounty_toolkit/core/rate_limiter.py bugbounty_toolkit/core/reporting.py bugbounty_toolkit/core/settings.py bugbounty_toolkit/diagnostics.py bugbounty_toolkit/reporting/review_markdown.py bugbounty_toolkit/cli.py bugbounty_toolkit/xss/parameter_tester.py bugbounty_toolkit/xss/playwright_confirm.py bugbounty_toolkit/analysis/live_review.py bugbounty_toolkit/ssrf_check.py tests/test_access_control.py tests/test_access_write_lab.py tests/test_access_cli.py tests/test_access_properties.py tests/test_execution_budget.py tests/test_maintenance.py tests/test_core_utilities.py tests/test_skill_plan.py tests/test_workflow.py tests/test_xss.py tests/test_live_ai_review.py tests/test_ssrf_check.py tests/test_apk_scan.py
      - run: mypy --strict
      - run: coverage run -m unittest discover -s tests -v
      - run: coverage report --include="bugbounty_toolkit/access_control/comparison.py,bugbounty_toolkit/access_control/write_lab.py" --fail-under=90
      - run: coverage report
