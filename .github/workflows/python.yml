name: Python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[xss,sqli,jwt,http,dev]"
      - run: python -m pip check
      - run: bbtk --help
      - run: ruff check bugbounty_toolkit/access_control/comparison.py bugbounty_toolkit/access_control/write_lab.py bugbounty_toolkit/cli.py tests/test_access_control.py tests/test_access_write_lab.py tests/test_access_cli.py tests/test_access_properties.py
      - run: ruff format --check bugbounty_toolkit/access_control/comparison.py bugbounty_toolkit/access_control/write_lab.py bugbounty_toolkit/cli.py tests/test_access_control.py tests/test_access_write_lab.py tests/test_access_cli.py tests/test_access_properties.py
      - run: mypy --strict
      - run: coverage run -m unittest discover -s tests -v
      - run: coverage report
