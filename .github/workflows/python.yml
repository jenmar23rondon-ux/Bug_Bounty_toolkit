name: Python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dashboard,xss,sqli,jwt,http,dev]"
      - run: python -m pip check
      - run: bbtk --help
      - run: bash -n labs/idor_lab/run.sh
      - run: ruff check bugbounty_toolkit tests scripts skills labs
      - run: ruff format --check bugbounty_toolkit tests scripts skills labs
      - run: mypy --strict
      - run: coverage run -m unittest discover -s tests -v
      - run: coverage report --include="bugbounty_toolkit/access_control/comparison.py,bugbounty_toolkit/access_control/write_lab.py" --fail-under=90
      - run: coverage report --include="bugbounty_toolkit/hunt.py,bugbounty_toolkit/ssrf_check.py,bugbounty_toolkit/csrf_audit.py,bugbounty_toolkit/jwt_forge.py" --fail-under=80
      - run: coverage report --include="bugbounty_toolkit/analysis/evidence_engine.py" --fail-under=85
      - run: coverage report --include="bugbounty_toolkit/analysis/api_workflow.py" --fail-under=80
      - run: coverage report --include="bugbounty_toolkit/analysis/evidence_graph.py" --fail-under=80
      - run: coverage report --include="bugbounty_toolkit/web_vuln_lab_server.py" --fail-under=80
      - run: coverage report --include="bugbounty_toolkit/access_control/function_matrix.py" --fail-under=80
      - run: coverage report --include="bugbounty_toolkit/analysis/benchmark.py" --fail-under=85
      - run: coverage report --include="bugbounty_toolkit/analysis/prioritization.py" --fail-under=85
      - run: coverage report --include="bugbounty_toolkit/analysis/investigation.py" --fail-under=85
      - run: coverage report --include="bugbounty_toolkit/reporting/finding_report.py" --fail-under=85
      - run: coverage report --include="bugbounty_toolkit/dashboard.py" --fail-under=80
      - run: coverage report --include="bugbounty_toolkit/fuzzing/wordlist_manager.py" --fail-under=80
      - run: coverage report
