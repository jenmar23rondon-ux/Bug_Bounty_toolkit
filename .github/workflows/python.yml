name: Python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[xss,sqli,jwt]"
      - run: python -m pip check
      - run: bbtk --help
      - run: python -m unittest discover -s tests -v
