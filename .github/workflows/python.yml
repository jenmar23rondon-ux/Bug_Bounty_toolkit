name: Python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[xss,sqli,jwt,http,dev]"
      - run: python -m pip check
      - run: bbtk --help
      - run: ruff check bugbounty_toolkit tests scripts skills
      - run: ruff format --check bugbounty_toolkit tests scripts skills
      - run: mypy --strict
      - run: coverage run -m unittest discover -s tests -v
      - run: coverage report --include="bugbounty_toolkit/access_control/comparison.py,bugbounty_toolkit/access_control/write_lab.py" --fail-under=90
      - run: coverage report --include="bugbounty_toolkit/hunt.py,bugbounty_toolkit/ssrf_check.py,bugbounty_toolkit/csrf_audit.py,bugbounty_toolkit/jwt_forge.py" --fail-under=80
      - run: coverage report
