name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[xss,sqli,jwt,http,dev]"
      - run: python -m pip check
      - run: bbtk --version
      - run: bash -n labs/idor_lab/run.sh
      - run: ruff check bugbounty_toolkit tests scripts skills labs
      - run: ruff format --check bugbounty_toolkit tests scripts skills labs
      - run: mypy --strict
      - run: coverage run -m unittest discover -s tests -v
      - run: coverage report --include="bugbounty_toolkit/access_control/comparison.py,bugbounty_toolkit/access_control/write_lab.py" --fail-under=90
      - run: coverage report --include="bugbounty_toolkit/hunt.py,bugbounty_toolkit/ssrf_check.py,bugbounty_toolkit/csrf_audit.py,bugbounty_toolkit/jwt_forge.py" --fail-under=80
      - run: coverage report --include="bugbounty_toolkit/analysis/evidence_engine.py" --fail-under=85
      - run: coverage report
      - name: Verify tag matches package version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$tag" = "$package_version"
      - run: python -m build
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
