name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[xss,sqli,jwt,http,dev]"
      - run: python -m pip check
      - run: bbtk --version
      - run: ruff check bugbounty_toolkit/access_control/comparison.py bugbounty_toolkit/access_control/range_checker.py bugbounty_toolkit/access_control/write_lab.py bugbounty_toolkit/core/execution_budget.py bugbounty_toolkit/core/http_client.py bugbounty_toolkit/core/rate_limiter.py bugbounty_toolkit/core/reporting.py bugbounty_toolkit/core/settings.py bugbounty_toolkit/diagnostics.py bugbounty_toolkit/reporting/review_markdown.py bugbounty_toolkit/cli.py bugbounty_toolkit/xss/parameter_tester.py bugbounty_toolkit/xss/playwright_confirm.py tests/test_access_control.py tests/test_access_write_lab.py tests/test_access_cli.py tests/test_access_properties.py tests/test_execution_budget.py tests/test_maintenance.py tests/test_core_utilities.py tests/test_skill_plan.py tests/test_workflow.py tests/test_xss.py
      - run: ruff format --check bugbounty_toolkit/access_control/comparison.py bugbounty_toolkit/access_control/range_checker.py bugbounty_toolkit/access_control/write_lab.py bugbounty_toolkit/core/execution_budget.py bugbounty_toolkit/core/http_client.py bugbounty_toolkit/core/rate_limiter.py bugbounty_toolkit/core/reporting.py bugbounty_toolkit/core/settings.py bugbounty_toolkit/diagnostics.py bugbounty_toolkit/reporting/review_markdown.py bugbounty_toolkit/cli.py bugbounty_toolkit/xss/parameter_tester.py bugbounty_toolkit/xss/playwright_confirm.py tests/test_access_control.py tests/test_access_write_lab.py tests/test_access_cli.py tests/test_access_properties.py tests/test_execution_budget.py tests/test_maintenance.py tests/test_core_utilities.py tests/test_skill_plan.py tests/test_workflow.py tests/test_xss.py
      - run: mypy --strict
      - run: coverage run -m unittest discover -s tests -v
      - run: coverage report --include="bugbounty_toolkit/access_control/comparison.py,bugbounty_toolkit/access_control/write_lab.py" --fail-under=90
      - run: coverage report
      - name: Verify tag matches package version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$tag" = "$package_version"
      - run: python -m build
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
