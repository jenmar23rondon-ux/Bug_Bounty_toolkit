[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bug-bounty-toolkit"
version = "0.2.2"
description = "Authorized bug bounty HTTP executor, ffuf adapter, parameter reflection checks, and evidence reporting."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Jenmar Rondon" }]
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
xss = ["beautifulsoup4>=4.12", "lxml>=5", "html5lib>=1.1", "playwright>=1.50"]
csrf = ["beautifulsoup4>=4.12"]
http = ["requests>=2.32.4", "aiohttp>=3.12.14", "httpx>=0.28.1,<1"]
sqli = ["sqlparse>=0.5.3"]
jwt = ["PyJWT[crypto]>=2.10.1,<3", "python-jose[cryptography]>=3.5,<4", "cryptography>=44", "jwcrypto>=1.5.6"]
takeover = ["dnspython>=2.6,<3"]
dashboard = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
databases = ["PyMySQL>=1.1.1", "psycopg2-binary>=2.9.10"]
dev = ["build>=1.2", "coverage[toml]>=7.6", "hypothesis>=6.100", "httpx2>=2,<3", "mypy>=1.11", "ruff>=0.8"]
all = [
    "beautifulsoup4>=4.12", "lxml>=5", "html5lib>=1.1", "playwright>=1.50",
    "requests>=2.32.4", "aiohttp>=3.12.14", "httpx>=0.28.1,<1", "sqlparse>=0.5.3",
    "PyJWT[crypto]>=2.10.1,<3", "python-jose[cryptography]>=3.5,<4",
    "cryptography>=44", "jwcrypto>=1.5.6", "dnspython>=2.6,<3", "PyMySQL>=1.1.1", "psycopg2-binary>=2.9.10",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [
    "build",
    "dist",
    "*.egg-info",
    ".test-deps",
    ".test-tmp",
    ".venv/**",
    "**/.venv/**",
    "templates/**",
    "**/templates/**",
    "inputs/**",
    "**/inputs/**",
    "reports/**",
    "**/reports/**",
    "registros/**",
    "**/registros/**",
    "logs/**",
    "**/logs/**",
    "wordlists/**",
    "**/wordlists/**",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = true
follow_imports = "silent"
files = [
    "labs/local_llm_quality_eval/corpus.py",
    "labs/local_llm_quality_eval/harness.py",
    "labs/local_llm_quality_eval/run.py",
    "tests/test_local_llm_quality_eval.py",
    "labs/eval_integrity/corpus_integrity.py",
    "labs/eval_integrity/pipeline.py",
    "labs/eval_integrity/mutations.py",
    "labs/eval_integrity/build_fixture.py",
    "labs/eval_integrity/registry.py",
    "bugbounty_toolkit/access_control/comparison.py",
    "bugbounty_toolkit/access_control/write_lab.py",
    "bugbounty_toolkit/access_control/function_matrix.py",
    "bugbounty_toolkit/core/execution_budget.py",
    "bugbounty_toolkit/core/private_files.py",
    "bugbounty_toolkit/core/redaction.py",
    "bugbounty_toolkit/core/runner.py",
    "bugbounty_toolkit/dashboard_triage.py",
    "bugbounty_toolkit/core/secure_subprocess.py",
    "bugbounty_toolkit/cors_check.py",
    "bugbounty_toolkit/open_redirect.py",
    "bugbounty_toolkit/sqli/parameter_tester.py",
    "bugbounty_toolkit/xss/test_cases.py",
    "bugbounty_toolkit/xss/result_validator.py",
    "bugbounty_toolkit/diagnostics.py",
    "bugbounty_toolkit/skill_data.py",
    "bugbounty_toolkit/analysis/live_review.py",
    "bugbounty_toolkit/hunt.py",
    "bugbounty_toolkit/apk_scan.py",
    "bugbounty_toolkit/ssrf_check.py",
    "bugbounty_toolkit/csrf_audit.py",
    "bugbounty_toolkit/jwt_forge.py",
    "bugbounty_toolkit/takeover_check.py",
    "bugbounty_toolkit/burp_import.py",
    "bugbounty_toolkit/case_generator.py",
    "bugbounty_toolkit/idor_discovery.py",
    "bugbounty_toolkit/idor_lab_server.py",
    "bugbounty_toolkit/web_vuln_lab_server.py",
    "bugbounty_toolkit/analysis/ollama_review.py",
    "bugbounty_toolkit/analysis/ai_providers.py",
    "bugbounty_toolkit/analysis/multi_review.py",
    "bugbounty_toolkit/analysis/ai_review_eval.py",
    "bugbounty_toolkit/ai_mock_server.py",
    "bugbounty_toolkit/analysis/artifact_review.py",
    "bugbounty_toolkit/analysis/ai_backend.py",
    "bugbounty_toolkit/analysis/dual_review.py",
    "bugbounty_toolkit/analysis/evidence_engine.py",
    "bugbounty_toolkit/analysis/api_workflow.py",
    "bugbounty_toolkit/analysis/object_relationships.py",
    "bugbounty_toolkit/analysis/har_import.py",
    "bugbounty_toolkit/analysis/har_provenance.py",
    "bugbounty_toolkit/analysis/object_handoff.py",
    "bugbounty_toolkit/analysis/evidence_graph.py",
    "bugbounty_toolkit/analysis/hypotheses.py",
    "bugbounty_toolkit/analysis/access_assessment.py",
    "bugbounty_toolkit/analysis/skill_router.py",
    "bugbounty_toolkit/analysis/benchmark.py",
    "bugbounty_toolkit/analysis/prioritization.py",
    "bugbounty_toolkit/analysis/investigation.py",
    "bugbounty_toolkit/analysis/investigation_memory.py",
    "bugbounty_toolkit/dashboard.py",
    "bugbounty_toolkit/reporting/finding_report.py",
    "bugbounty_toolkit/fuzzing/wordlist_manager.py",
    "bugbounty_toolkit/fuzzing/content_ranking.py",
    "bugbounty_toolkit/fuzzing/content_eval.py",
    "bugbounty_toolkit/fuzzing/context_planner.py",
    "bugbounty_toolkit/fuzzing/capture_adapter.py",
    "bugbounty_toolkit/context_fuzz_lab_server.py",
]

[tool.coverage.run]
branch = false
source = ["bugbounty_toolkit", "scripts", "skills/bugbounty-executor/scripts"]

[tool.coverage.report]
fail_under = 77
show_missing = true
skip_covered = true

[project.scripts]
bbtk = "bugbounty_toolkit.cli:main"
bugbounty = "bugbounty_toolkit.cli:main"

[tool.setuptools.data-files]
"share/bug-bounty-toolkit/skills/bugbounty-access-control" = ["skills/bugbounty-access-control/SKILL.md"]
