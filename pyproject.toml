[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bug-bounty-toolkit"
version = "0.2.1"
description = "Authorized bug bounty HTTP executor, ffuf adapter, parameter reflection checks, and evidence reporting."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Jenmar Rondon" }]
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
xss = ["beautifulsoup4>=4.12", "lxml>=5", "html5lib>=1.1", "playwright>=1.50"]
csrf = ["beautifulsoup4>=4.12"]
http = ["requests>=2.32.4", "aiohttp>=3.12.14", "httpx>=0.28.1,<1"]
sqli = ["sqlparse>=0.5.3"]
jwt = ["PyJWT[crypto]>=2.10.1,<3", "python-jose[cryptography]>=3.5,<4", "cryptography>=44", "jwcrypto>=1.5.6"]
takeover = ["dnspython>=2.6,<3"]
databases = ["PyMySQL>=1.1.1", "psycopg2-binary>=2.9.10"]
dev = ["build>=1.2", "coverage[toml]>=7.6", "hypothesis>=6.100", "mypy>=1.11", "ruff>=0.8"]
all = [
    "beautifulsoup4>=4.12", "lxml>=5", "html5lib>=1.1", "playwright>=1.50",
    "requests>=2.32.4", "aiohttp>=3.12.14", "httpx>=0.28.1,<1", "sqlparse>=0.5.3",
    "PyJWT[crypto]>=2.10.1,<3", "python-jose[cryptography]>=3.5,<4",
    "cryptography>=44", "jwcrypto>=1.5.6", "dnspython>=2.6,<3", "PyMySQL>=1.1.1", "psycopg2-binary>=2.9.10",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [
    "build",
    "dist",
    "*.egg-info",
    ".test-deps",
    ".test-tmp",
    ".venv/**",
    "**/.venv/**",
    "templates/**",
    "**/templates/**",
    "inputs/**",
    "**/inputs/**",
    "reports/**",
    "**/reports/**",
    "registros/**",
    "**/registros/**",
    "logs/**",
    "**/logs/**",
    "wordlists/**",
    "**/wordlists/**",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = true
follow_imports = "silent"
files = [
    "bugbounty_toolkit/access_control/comparison.py",
    "bugbounty_toolkit/access_control/write_lab.py",
    "bugbounty_toolkit/core/execution_budget.py",
    "bugbounty_toolkit/core/runner.py",
    "bugbounty_toolkit/cors_check.py",
    "bugbounty_toolkit/open_redirect.py",
    "bugbounty_toolkit/sqli/parameter_tester.py",
    "bugbounty_toolkit/xss/test_cases.py",
    "bugbounty_toolkit/xss/result_validator.py",
    "bugbounty_toolkit/diagnostics.py",
    "bugbounty_toolkit/analysis/live_review.py",
    "bugbounty_toolkit/hunt.py",
    "bugbounty_toolkit/apk_scan.py",
    "bugbounty_toolkit/ssrf_check.py",
    "bugbounty_toolkit/csrf_audit.py",
    "bugbounty_toolkit/jwt_forge.py",
    "bugbounty_toolkit/takeover_check.py",
    "bugbounty_toolkit/burp_import.py",
    "bugbounty_toolkit/case_generator.py",
    "bugbounty_toolkit/idor_lab_server.py",
    "bugbounty_toolkit/analysis/ollama_review.py",
    "bugbounty_toolkit/analysis/artifact_review.py",
    "bugbounty_toolkit/analysis/evidence_engine.py",
    "bugbounty_toolkit/analysis/hypotheses.py",
    "bugbounty_toolkit/analysis/access_assessment.py",
    "bugbounty_toolkit/analysis/skill_router.py",
]

[tool.coverage.run]
branch = false
source = ["bugbounty_toolkit", "scripts", "skills/bugbounty-executor/scripts"]

[tool.coverage.report]
fail_under = 77
show_missing = true
skip_covered = true

[project.scripts]
bbtk = "bugbounty_toolkit.cli:main"
bugbounty = "bugbounty_toolkit.cli:main"

[tool.setuptools.packages.find]
include = ["bugbounty_toolkit*"]
