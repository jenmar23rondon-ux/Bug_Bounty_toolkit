[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bug-bounty-toolkit"
version = "0.2.0"
description = "Authorized bug bounty HTTP executor, ffuf adapter, parameter reflection checks, and evidence reporting."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jenmar Rondon" }]
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
xss = ["beautifulsoup4>=4.12", "lxml>=5", "html5lib>=1.1", "playwright>=1.50"]
http = ["requests>=2.32.4", "aiohttp>=3.12.14", "httpx>=0.28.1,<1"]
sqli = ["sqlparse>=0.5.3"]
jwt = ["PyJWT[crypto]>=2.10.1,<3", "python-jose[cryptography]>=3.5,<4", "cryptography>=44", "jwcrypto>=1.5.6"]
databases = ["PyMySQL>=1.1.1", "psycopg2-binary>=2.9.10"]
all = [
    "beautifulsoup4>=4.12", "lxml>=5", "html5lib>=1.1", "playwright>=1.50",
    "requests>=2.32.4", "aiohttp>=3.12.14", "httpx>=0.28.1,<1", "sqlparse>=0.5.3",
    "PyJWT[crypto]>=2.10.1,<3", "python-jose[cryptography]>=3.5,<4",
    "cryptography>=44", "jwcrypto>=1.5.6", "PyMySQL>=1.1.1", "psycopg2-binary>=2.9.10",
]

[project.scripts]
bbtk = "bugbounty_toolkit.cli:main"
bugbounty = "bugbounty_toolkit.cli:main"

[tool.setuptools.packages.find]
include = ["bugbounty_toolkit*"]
